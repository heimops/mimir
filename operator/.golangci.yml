linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam

linters-settings:
  goimports:
    local-prefixes: mimir.io/operator

issues:
  exclude-rules:
    # errcheck on deferred calls and test cleanup is noise
    - path: _test\.go
      linters: [errcheck]
    - source: "defer "
      linters: [errcheck]
