{{- if .Values.webhook.enabled }}
---
# Service that exposes the operator's webhook server (port 9443)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mimir.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mimir.labels" . | nindent 4 }}
spec:
  ports:
    - name: webhook
      port: 443
      targetPort: 9443
  selector:
    app.kubernetes.io/name: mimir
    app.kubernetes.io/component: operator
---
# Self-signed issuer — no external CA needed
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "mimir.fullname" . }}-selfsigned
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mimir.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
# Certificate — cert-manager creates the Secret and rotates it automatically
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "mimir.fullname" . }}-webhook-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mimir.labels" . | nindent 4 }}
spec:
  dnsNames:
    - {{ include "mimir.fullname" . }}-webhook.{{ .Release.Namespace }}.svc
    - {{ include "mimir.fullname" . }}-webhook.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: {{ include "mimir.fullname" . }}-selfsigned
  secretName: {{ include "mimir.fullname" . }}-webhook-tls
---
# ValidatingWebhookConfiguration — cert-manager injects the CA bundle automatically
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "mimir.fullname" . }}
  labels:
    {{- include "mimir.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "mimir.fullname" . }}-webhook-cert
spec:
  webhooks:
    - name: vbackupschedule.mimir.io
      admissionReviewVersions: [v1]
      sideEffects: None
      failurePolicy: Fail
      clientConfig:
        service:
          name: {{ include "mimir.fullname" . }}-webhook
          namespace: {{ .Release.Namespace }}
          path: /validate-mimir-io-v1alpha1-backupschedule
      rules:
        - apiGroups:   [mimir.io]
          apiVersions: [v1alpha1]
          operations:  [CREATE, UPDATE]
          resources:   [backupschedules]
{{- end }}
