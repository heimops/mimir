{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "mimir.fullname" . }}
  labels:
    {{- include "mimir.labels" . | nindent 4 }}
rules:
  # Operator: watch and reconcile BackupSchedule CRDs cluster-wide
  - apiGroups: [mimir.io]
    resources: [backupschedules]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [mimir.io]
    resources: [backupschedules/status]
    verbs: [patch, update]
  - apiGroups: [mimir.io]
    resources: [backupschedules/finalizers]
    verbs: [update]

  # Operator: manage CronJobs in its own namespace (handled by Role, but cluster scope is simpler)
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]

  # App: list PVCs in any namespace to discover what needs backing up
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch]

  # App: create/manage backup Jobs in target namespaces (same namespace as the PVC)
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]

  # Operator: leader election and event writing
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
{{- end }}
