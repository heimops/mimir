name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # create GitHub Release
  packages: write   # push to ghcr.io
  id-token: write   # cosign keyless signing via OIDC

env:
  REGISTRY: ghcr.io
  ORG: heimops

jobs:
  release:
    name: Build, push, sign and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: operator/go.sum

      # ── Docker setup ────────────────────────────────────────────────────────
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Operator image ───────────────────────────────────────────────────────
      - name: Operator image metadata
        id: meta-operator
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/mimir-operator
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push operator image
        id: push-operator
        uses: docker/build-push-action@v5
        with:
          context: operator
          push: true
          tags: ${{ steps.meta-operator.outputs.tags }}
          labels: ${{ steps.meta-operator.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── App image ────────────────────────────────────────────────────────────
      - name: App image metadata
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/mimir
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push app image
        id: push-app
        uses: docker/build-push-action@v5
        with:
          context: agent
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Cosign: install once, used for signing and attestations ─────────────
      - uses: sigstore/cosign-installer@v3

      # ── Sign images ─────────────────────────────────────────────────────────
      - name: Sign operator image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.ORG }}/mimir-operator@${{ steps.push-operator.outputs.digest }}

      - name: Sign app image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.ORG }}/mimir@${{ steps.push-app.outputs.digest }}

      # ── SBOM: generate files, attach to images, and create signed attestations
      - name: SBOM — operator
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.ORG }}/mimir-operator@${{ steps.push-operator.outputs.digest }}
          artifact-name: sbom-operator.spdx.json
          output-file: /tmp/sbom-operator.spdx.json

      - name: SBOM — app
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.ORG }}/mimir@${{ steps.push-app.outputs.digest }}
          artifact-name: sbom-app.spdx.json
          output-file: /tmp/sbom-app.spdx.json

      # cosign attest creates a signed attestation stored in the OCI registry.
      # Consumers can verify it with `cosign verify-attestation --type spdx`.
      - name: Attest SBOM — operator
        run: |
          cosign attest --yes \
            --predicate /tmp/sbom-operator.spdx.json \
            --type spdx \
            ${{ env.REGISTRY }}/${{ env.ORG }}/mimir-operator@${{ steps.push-operator.outputs.digest }}

      - name: Attest SBOM — app
        run: |
          cosign attest --yes \
            --predicate /tmp/sbom-app.spdx.json \
            --type spdx \
            ${{ env.REGISTRY }}/${{ env.ORG }}/mimir@${{ steps.push-app.outputs.digest }}

      # ── Helm chart ────────────────────────────────────────────────────────────
      - uses: azure/setup-helm@v4

      - name: Package and push Helm chart
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          helm package charts/mimir --version "${VERSION}" --app-version "${VERSION}"
          helm push "mimir-${VERSION}.tgz" oci://${{ env.REGISTRY }}/${{ env.ORG }}/charts

      # ── GitHub Release ────────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            mimir-*.tgz
            /tmp/sbom-operator.spdx.json
            /tmp/sbom-app.spdx.json
