name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Go operator ────────────────────────────────────────────────────────────
  operator-test:
    name: Operator — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: operator/go.sum

      - name: Install setup-envtest
        working-directory: operator
        run: go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest

      - name: Run tests
        working-directory: operator
        run: make test

  operator-lint:
    name: Operator — lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: operator/go.sum

      - uses: golangci/golangci-lint-action@v6
        with:
          working-directory: operator
          version: v1.57

  operator-build:
    name: Operator — docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: operator
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Python agent ───────────────────────────────────────────────────────────
  agent-lint:
    name: Agent — lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        working-directory: agent
        run: ruff check .

  agent-build:
    name: Agent — docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: agent
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Helm chart ─────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm — lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint charts/mimir
